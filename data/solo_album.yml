title: "Songs I Made"
artist: "David Marsden"
year: 2026
subtitle: "An album of songs I made, borrowed, bent and broke."
intro: "Eleven songs, covers, rewrites and oddities made over a number of years and gathered together here."
tracks:
  - number: 1
    title: "Since You Turned On"
    url: "https://davidmarsden.info/uploads/2026/since-you-turned-on.m4a"
    kind: "Original"
    note: "Written in 2025 as an attempt to imagine what a new Hovercraft song might sound like if we wrote and performed one now."
  - number: 2
    title: "Pump Dot IO"
    url: "https://davidmarsden.info/uploads/2026/3be3106c93.m4a"
    kind: "After Elvis Costello"
    note: "A 2013 riff on Pump It Up, written for This Is Not A Podcast with Evan Prodromou. 'Dents' came from the identi.ca/StatusNet world; 'Pump your life in and out of your friends' was Pump.io's own tagline."
    links:
      - label: "The Prince of Aberystwyth"
        url: "https://notapodcast.tumblr.com/post/57337280889/9-the-prince-of-aberystwyth"
  - number: 3
    title: "Dream Job"
    url: "https://davidmarsden.info/uploads/2026/dream-job-trajectory.m4a"
    kind: "Original"
    note: "Built from an AI-generated summary of my 2024–25 autobiographical writing about work: the jobs I hated, the care work I unexpectedly loved, and the institutions that can turn meaningful work into targets, metrics and tick-boxes."
    links:
      - label: "Curriculum Vitae (Memento Vivere)"
        url: "https://davidmarsden.info/2024/01/24/curriculum-vitae-memento-vivere.html"
      - label: "Notebook transcript"
        url: "https://davidmarsden.info/transcripts/2024/10/29/1603.html"
  - number: 4
    title: "Individuality"
    url: "https://davidmarsden.info/uploads/2026/individuality-1.m4a"
    kind: "After Billy Bragg"
    note: "A take on Billy Bragg's Sexuality, written as the musical coda to a Southall Stories piece about Ealing Council's new logo, its promise to respect the individuality of residents, and the gap between branding, consultation and representation."
    links:
      - label: "Individuality — Southall Stories"
        url: "https://southallstories.uk/2026/05/29/individuality/"
  - number: 5
    title: "Doomscrolling"
    url: "https://davidmarsden.info/uploads/2026/doomscrolling.m4a"
    kind: "Original"
    note: "A comic song about scrolling until it isn't funny any more: wrists, algorithms, Gaza, public language and the things a phone can put next to each other."
    links:
      - label: "A little tune I created"
        url: "https://davidmarsden.info/2025/05/13/a-little-tune-i-created.html"
  - number: 6
    title: "Woven Sky"
    url: "https://davidmarsden.info/uploads/2026/woven-sky.m4a"
    kind: "Inspired by The Blood of Flowers"
    note: "Inspired by The Blood of Flowers: displacement, the move from village to city, carpet-making, discovery and a young woman learning to shape her own life."
  - number: 7
    title: "All I Want To Do"
    url: "https://davidmarsden.info/uploads/2026/all-i-want-to-do.m4a"
    kind: "Original"
    note: "A grief song stripped down to the things grief keeps repeating: missing someone, dreaming of them, waking alone and wanting to hold them again."
  - number: 8
    title: "Here Now"
    url: "https://davidmarsden.info/uploads/2026/here-now-5.m4a"
    kind: "Written by Piers · 2009"
    note: "In 2009 I asked Piers to make amends for selling my Park amp for alcohol thirteen years earlier by writing me a love song I could sing and play to Juli. A few days later a note arrived in the post with a CD, lyrics and chords for Here Now. I made my own arrangement in 2013–14; years later it found its way back into the Hovercraft orbit."
    links:
      - label: "Hovercraft interview — FVMusicBlog"
        url: "https://fvmusicblog.com/interview-hovercraft/"
      - label: "Here Now — BandLab"
        url: "https://www.bandlab.com/track/f979b840-128c-f011-b480-6045bd35f0e2?revId=f879b840-128c-f011-b480-6045bd35f0e2"
  - number: 9
    title: "Jimmy Carter"
    url: "https://davidmarsden.info/uploads/2026/jimmy-carter-1.m4a"
    kind: "After 20lb Sounds"
    note: "A football cover of a 20lb Sounds song about the Jimmy Carter everyone knows, rewritten for the former Millwall, Liverpool, Arsenal and Portsmouth winger."
    links:
      - label: "There's Only One..."
        url: "https://davidmarsden.info/2011/07/19/theres-only-one.html"
      - label: "Whatever happened to Jimmy Carter?"
        url: "https://davidmarsden.info/2014/05/17/whatever-happened-to.html"
  - number: 10
    title: "A New Ingerland"
    url: "https://davidmarsden.info/uploads/2026/53b8e0e522.m4a"
    kind: "After Billy Bragg"
    note: "First written in 2014 after years of writing about England's football failures, then updated twelve years later. Older singer, newer disappointments, same old England."
    links:
      - label: "A New Ingerland (2014)"
        url: "https://davidmarsden.info/2014/06/03/a-new-ingerland.html"
      - label: "Same Old England"
        url: "https://davidmarsden.info/2016/11/12/same-old-england.html"
  - number: 11
    title: "Satisfaction"
    url: "https://davidmarsden.info/uploads/2026/satisfaction.m4a"
    kind: "Rolling Stones cover"
    note: "My preferred electric-guitar and full-band arrangement: still a reinterpretation rather than a Stones replica, but with enough muscle to sit naturally at the end of this album."
