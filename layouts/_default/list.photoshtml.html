{{ define "main" }}
{{ with .Site.GetPage "/photos" }}
<main class="photo-showcase">
  <header class="photo-showcase-header">
    <p class="photo-showcase-kicker">Photography</p>
    <h1>{{ .Title }}</h1>
    <p class="photo-showcase-intro">A selection of favourite photographs.</p>
  </header>

  <div class="photo-showcase-gallery">
    {{ .Content }}
  </div>
</main>
{{ else }}
<main class="photo-showcase">
  <header class="photo-showcase-header">
    <p class="photo-showcase-kicker">Photography</p>
    <h1>Photos</h1>
  </header>
  <p>The Photos page could not be loaded.</p>
</main>
{{ end }}
{{ end }}
